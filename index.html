<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="icon.png">

  <title>Лес из бетона</title>

  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    img {
      width: 100%;
      max-width: 1400px;
      display: block;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<script>
for (let i = 1; i <= 91; i++) {

  let number = String(i).padStart(2, '0');

  let img = document.createElement("img");
  img.loading = "lazy";
  img.src = `webp/${number}.webp`;

  document.body.appendChild(img);
}
</script>

</body>
</html>
